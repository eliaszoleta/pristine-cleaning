# One-time diagnostic: sends a test quote through the live site's /api/quote and directly to the
# GHL Inbound Webhook, so GHL receives a sample request for field mapping. Safe to delete afterwards.
name: Test quote webhook
on:
  push:
    branches: [claude/funny-hopper-5ihafs]
    paths: [.github/workflows/test-quote-webhook.yml]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test through the public site (/api/quote)
        run: |
          base=https://pristine-cleaning-nine.vercel.app
          echo "GET $base/api/quote:"; curl -s -w '\nHTTP %{http_code}\n' "$base/api/quote"
          echo "POST $base/api/quote:"
          curl -s -w '\nHTTP %{http_code}\n' -X POST "$base/api/quote" -H 'Content-Type: application/json' \
            -d '{"first_name":"Test","last_name":"Website Form","email":"test+webhook@pristinecleaning.example","phone":"7255550100","city":"Mesquite","service":"Deep Residential Cleaning","property_size":"2-3 Bedrooms (1,000 - 2,200 sq ft)","frequency":"One-time Clean","notes":"TEST submission through the live website - safe to delete","page_url":"https://pristine-cleaning-nine.vercel.app/contact","company_website":""}'
