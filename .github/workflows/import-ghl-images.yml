# One-time job: copies the images still hosted on GoHighLevel (vibe.filesafe.space) into the
# repo so the site keeps working after the AI Studio project is deleted. Safe to delete afterwards.
name: Import GHL-hosted images
on:
  push:
    branches: [claude/funny-hopper-5ihafs]
    paths: [.github/workflows/import-ghl-images.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          set -e
          mkdir -p ghl-import
          base=https://vibe.filesafe.space/1790470415330648323
          while read -r path name; do
            curl -fsSL --retry 3 "$base/$path" -o "ghl-import/$name"
            echo "$name $(stat -c%s ghl-import/$name) bytes"
          done <<'LIST'
          assets/85b00af9-5f4a-44cc-aada-a1b3e6368972.png airbnb-turnover.png
          assets/cd04ee46-9601-4d84-b2c6-1e5d3d70d370.png deep-residential.png
          assets/f3c923f2-7d88-4948-b69e-d48fcd5918f9.png post-construction.png
          assets/7337cd39-3829-43ef-8498-681ebc03418e.png standard-maintenance.png
          attachments/41cf238d-cdd8-4feb-b925-31eb62fd2971.jpg logo-ghl.jpg
          attachments/699b3366-6d1a-4661-bd51-0d1e8c1ffb5b.jpg mesquite-hardwood-floors-deep-clean-before-after.jpg
          attachments/0fb2019d-0f7d-44e7-85e0-1957f2513f29.jpg mesquite-luxury-kitchen-post-construction-cleaning-service.jpg
          attachments/423c0516-2594-4668-b38f-a62e19c539b5.jpg mesquite-modern-bathroom-turnover-deep-cleaning.jpg
          attachments/f85cc4da-c8ad-4a1d-b063-e527c737e320.jpg mesquite-airbnb-guest-ready-turnover-bathroom-staging.jpg
          attachments/3d6deb66-863c-40c1-8398-b9514cb09752.jpg mesquite-residential-granite-kitchen-counter-cleaning.jpg
          attachments/0bef0300-e77c-44c8-a56b-dfaf34a1ba2a.jpg mesquite-open-concept-vacation-rental-turnover-living-kitchen.jpg
          attachments/e493bc2f-4e89-4cbd-ab43-30286007538f.jpg mesquite-residential-living-room-fireplace-area-cleaning.jpg
          attachments/d235b390-9463-4de1-804a-57d61dab7056.jpg mesquite-dining-room-wood-furniture-deep-cleaning.jpg
          attachments/75726b66-995c-47ca-8005-77c0b977ba9f.jpg mesquite-bathtub-mineral-stain-removal-before-after.jpg
          attachments/97071355-3c00-4905-ad8e-d888192c02ba.jpg mesquite-master-bathroom-vanity-post-construction-cleaning.jpg
          LIST
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghl-import
          git commit -m "Import GHL-hosted images into repo"
          git push
