# One-time job: fetches CC0 / public-domain pressure-washing photo candidates from Openverse so
# one can be picked for the site. Safe to delete afterwards.
name: Fetch stock photo candidates
on:
  push:
    branches: [claude/funny-hopper-5ihafs]
    paths: [.github/workflows/fetch-stock-candidates.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search and download
        run: |
          mkdir -p stock-candidates
          echo "[]" > stock-candidates/meta.json
          n=0
          for q in "pressure washing" "power washing driveway" "pressure washer patio" "pressure washer concrete"; do
            enc=$(jq -rn --arg q "$q" '$q|@uri')
            curl -fsSL "https://api.openverse.org/v1/images/?q=$enc&license=cc0,pdm&page_size=8&mature=false" -o r.json || continue
            jq -c '.results[] | {id, title, url, license, creator, foreign_landing_url, width, height}' r.json | while read -r row; do
              n=$((n+1))
              id=$(echo "$row" | jq -r .id); url=$(echo "$row" | jq -r .url)
              if curl -fsSL -m 30 "$url" -o "stock-candidates/$id.img"; then
                echo "$row" >> stock-candidates/rows.jsonl
              fi
            done
          done
          ls -la stock-candidates
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-candidates
          git commit -m "Add stock photo candidates" && git push
